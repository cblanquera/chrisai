<button class="wf-button" type="button" data-wf-dialog-open="#notifications">Open notifications</button>

<dialog class="wf-dialog wf-dialog--sheet wf-dialog--sheet-top" id="notifications" data-wf-dialog-backdrop-close>
  <div class="wf-dialog__header">
    <h2 class="wf-subheading">Notifications</h2>
    <button class="wf-button wf-button--ghost wf-icon-button" type="button" data-wf-dialog-close aria-label="Close notifications">
      <span data-wf-icon="close"></span>
    </button>
  </div>
  <div class="wf-dialog__body wf-stack">
    <p class="wf-copy">Three records are ready for review.</p>
  </div>
</dialog>
