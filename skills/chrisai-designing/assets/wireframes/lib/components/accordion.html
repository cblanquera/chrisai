<section class="wf-accordion" data-wf-accordion data-wf-accordion-single>
  <div class="wf-accordion__item">
    <button class="wf-accordion__trigger" type="button" aria-expanded="true" aria-controls="account-details">
      Account details
      <span class="wf-accordion__icon" data-wf-icon="chevron-right"></span>
    </button>
    <div class="wf-accordion__panel" id="account-details">
      Account name, owner, billing status, and workspace metadata.
    </div>
  </div>
  <div class="wf-accordion__item">
    <button class="wf-accordion__trigger" type="button" aria-expanded="false" aria-controls="account-permissions">
      Permissions
      <span class="wf-accordion__icon" data-wf-icon="chevron-right"></span>
    </button>
    <div class="wf-accordion__panel" id="account-permissions" hidden>
      Role assignment, invite status, and access exceptions.
    </div>
  </div>
</section>
