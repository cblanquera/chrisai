<button class="wf-button" type="button" data-wf-dialog-open="#quick-actions">Open quick actions</button>

<dialog class="wf-dialog wf-dialog--sheet wf-dialog--sheet-bottom" id="quick-actions" data-wf-dialog-backdrop-close>
  <div class="wf-dialog__header">
    <h2 class="wf-subheading">Quick actions</h2>
    <button class="wf-button wf-button--ghost wf-icon-button" type="button" data-wf-dialog-close aria-label="Close quick actions">
      <span data-wf-icon="close"></span>
    </button>
  </div>
  <div class="wf-dialog__body wf-stack">
    <button class="wf-button wf-button--secondary" type="button">Create record</button>
    <button class="wf-button wf-button--secondary" type="button">Invite member</button>
  </div>
</dialog>
