<div class="wf-field" data-wf-password-field>
  <label class="wf-label" for="account-password">Password</label>
  <div class="wf-password-field">
    <input class="wf-input wf-password-field__input" id="account-password" name="account-password" type="password" value="prototype-password">
    <button class="wf-button wf-button--ghost wf-icon-button wf-password-field__toggle" type="button" data-wf-password-toggle aria-label="Show password" aria-pressed="false">
      <span data-wf-icon="eye"></span>
    </button>
  </div>
  <p class="wf-help">Use at least 12 characters.</p>
</div>
