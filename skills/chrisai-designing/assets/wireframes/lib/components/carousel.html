<section class="wf-carousel" data-wf-carousel aria-label="Setup steps">
  <div class="wf-carousel__track">
    <article class="wf-carousel__slide">
      <h2 class="wf-heading">Create the workspace</h2>
      <p class="wf-copy">Enter the workspace identity and ownership details.</p>
    </article>
    <article class="wf-carousel__slide">
      <h2 class="wf-heading">Invite the team</h2>
      <p class="wf-copy">Assign roles and send access invitations.</p>
    </article>
    <article class="wf-carousel__slide">
      <h2 class="wf-heading">Review settings</h2>
      <p class="wf-copy">Confirm the workspace configuration before launch.</p>
    </article>
  </div>
  <div class="wf-carousel__controls">
    <button class="wf-button wf-button--secondary" type="button" data-wf-carousel-action="prev">
      <span data-wf-icon="arrow-left"></span>
      Previous
    </button>
    <div class="wf-carousel__dots">
      <button class="wf-carousel__dot" type="button" data-wf-carousel-dot="0" aria-label="Step 1"></button>
      <button class="wf-carousel__dot" type="button" data-wf-carousel-dot="1" aria-label="Step 2"></button>
      <button class="wf-carousel__dot" type="button" data-wf-carousel-dot="2" aria-label="Step 3"></button>
    </div>
    <button class="wf-button" type="button" data-wf-carousel-action="next">
      Next
      <span data-wf-icon="arrow-right"></span>
    </button>
  </div>
</section>
