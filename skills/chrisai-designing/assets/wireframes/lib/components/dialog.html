<button class="wf-button" type="button" data-wf-dialog-open="#confirm-status">Change status</button>

<dialog class="wf-dialog" id="confirm-status">
  <div class="wf-dialog__header">
    <h2 class="wf-subheading">Confirm status change</h2>
    <button class="wf-button wf-button--ghost wf-icon-button" type="button" data-wf-dialog-close aria-label="Close">
      <span data-wf-icon="close"></span>
    </button>
  </div>
  <div class="wf-dialog__body">
    <p class="wf-copy">This record will become visible to workspace members.</p>
  </div>
  <div class="wf-dialog__footer">
    <button class="wf-button wf-button--secondary" type="button" data-wf-dialog-close>Cancel</button>
    <button class="wf-button" type="button" data-wf-dialog-close value="confirm">Confirm</button>
  </div>
</dialog>
