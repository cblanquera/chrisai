<div class="wf-field">
  <label class="wf-label" for="contact-phone">Phone number</label>
  <div class="wf-phone-field">
    <label class="wf-sr-only" for="contact-phone-code">Country calling code</label>
    <select class="wf-phone-field__code" id="contact-phone-code" name="contact-phone-code">
      <option value="+1">🇺🇸 +1</option>
      <option value="+1-ca">🇨🇦 +1</option>
      <option value="+44">🇬🇧 +44</option>
      <option value="+61">🇦🇺 +61</option>
      <option value="+81">🇯🇵 +81</option>
      <option value="+63">🇵🇭 +63</option>
      <option value="+65">🇸🇬 +65</option>
      <option value="+49">🇩🇪 +49</option>
      <option value="+33">🇫🇷 +33</option>
      <option value="+55">🇧🇷 +55</option>
    </select>
    <input class="wf-phone-field__number" id="contact-phone" name="contact-phone" type="tel" inputmode="tel" placeholder="555 012 3400">
  </div>
  <p class="wf-help">Include the number used for account recovery.</p>
</div>
