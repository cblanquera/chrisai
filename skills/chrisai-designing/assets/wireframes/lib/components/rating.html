<div class="wf-field">
  <span class="wf-label" id="service-rating-label">Service rating</span>
  <div class="wf-rating" data-wf-rating role="radiogroup" aria-labelledby="service-rating-label">
    <input type="hidden" name="service-rating" value="4">
    <button type="button" role="radio" aria-checked="false" data-wf-rating-value="1" data-wf-rating-filled aria-label="1 star"><span data-wf-icon="star"></span></button>
    <button type="button" role="radio" aria-checked="false" data-wf-rating-value="2" data-wf-rating-filled aria-label="2 stars"><span data-wf-icon="star"></span></button>
    <button type="button" role="radio" aria-checked="false" data-wf-rating-value="3" data-wf-rating-filled aria-label="3 stars"><span data-wf-icon="star"></span></button>
    <button type="button" role="radio" aria-checked="true" data-wf-rating-value="4" data-wf-rating-filled aria-label="4 stars"><span data-wf-icon="star"></span></button>
    <button type="button" role="radio" aria-checked="false" data-wf-rating-value="5" aria-label="5 stars"><span data-wf-icon="star"></span></button>
    <output data-wf-rating-output>4 of 5</output>
  </div>
</div>
