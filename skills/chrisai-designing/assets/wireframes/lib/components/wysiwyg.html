<div class="wf-field">
  <span class="wf-label" id="description-editor-label">Description</span>
  <div class="wf-wysiwyg" data-wf-wysiwyg>
    <div class="wf-wysiwyg__toolbar" role="toolbar" aria-label="Text formatting">
      <button type="button" data-wf-editor-command="bold" aria-label="Bold" aria-pressed="false"><span data-wf-icon="bold"></span></button>
      <button type="button" data-wf-editor-command="italic" aria-label="Italic" aria-pressed="false"><span data-wf-icon="italic"></span></button>
      <button type="button" data-wf-editor-command="underline" aria-label="Underline" aria-pressed="false"><span data-wf-icon="underline"></span></button>
      <span class="wf-wysiwyg__divider" aria-hidden="true"></span>
      <button type="button" data-wf-editor-command="insertUnorderedList" aria-label="Bulleted list"><span data-wf-icon="list"></span></button>
      <button type="button" data-wf-editor-command="insertOrderedList" aria-label="Numbered list"><span data-wf-icon="list-ordered"></span></button>
      <button type="button" data-wf-editor-command="createLink" aria-label="Add link"><span data-wf-icon="link"></span></button>
      <span class="wf-wysiwyg__divider" aria-hidden="true"></span>
      <button type="button" data-wf-editor-command="undo" aria-label="Undo"><span data-wf-icon="undo"></span></button>
      <button type="button" data-wf-editor-command="redo" aria-label="Redo"><span data-wf-icon="redo"></span></button>
    </div>
    <div class="wf-wysiwyg__editor" contenteditable="true" role="textbox" aria-multiline="true" aria-labelledby="description-editor-label" data-wf-editor-content>
      <p>Provide a clear summary for workspace members.</p>
      <ul><li>State the expected outcome.</li><li>Include relevant constraints.</li></ul>
    </div>
  </div>
  <p class="wf-help">Formatting is represented for prototype review.</p>
</div>
