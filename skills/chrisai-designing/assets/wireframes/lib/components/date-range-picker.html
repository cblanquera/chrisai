<div class="wf-field" data-wf-date-range>
  <span class="wf-label" id="report-range-label">Reporting period</span>
  <button class="wf-date-range__trigger" type="button" data-wf-date-range-trigger aria-expanded="false" aria-controls="report-range-calendar" aria-labelledby="report-range-label report-range-value">

    </div>

    <div class="wf-date-range__days" role="grid" aria-label="September 2026">

    <div class="wf-date-range__footer"><span data-wf-date-range-status>Select a start date</span><button class="wf-button wf-button--ghost" type="button" data-wf-date-range-clear>Clear</button></div>
  </div>
  <input type="hidden" name="range-start" value="2026-09-08" data-wf-date-range-start>
  <input type="hidden" name="range-end" value="2026-09-18" data-wf-date-range-end>
</div>
