<div class="wf-field">
  <label class="wf-label" for="record-tags">Tags</label>
  <div class="wf-tags-input" data-wf-tags>
    <div class="wf-tags-input__items" data-wf-tags-items>
      <span class="wf-tags-input__tag">Priority<button type="button" data-wf-tag-remove aria-label="Remove Priority"><span data-wf-icon="close"></span></button></span>
      <span class="wf-tags-input__tag">Review<button type="button" data-wf-tag-remove aria-label="Remove Review"><span data-wf-icon="close"></span></button></span>
    </div>
    <input id="record-tags" data-wf-tags-input placeholder="Add a tag" autocomplete="off">
  </div>
  <p class="wf-help">Press Enter or comma to add a tag.</p>
</div>
