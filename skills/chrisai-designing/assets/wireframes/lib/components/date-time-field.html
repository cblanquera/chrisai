<div class="wf-form">
  <div class="wf-field">
    <label class="wf-label" for="due-date">Date</label>
    <div class="wf-date-time-field">
      <input class="wf-input" id="due-date" name="due-date" type="date" value="2026-09-18" data-wf-picker-input>
      <button class="wf-button wf-button--ghost wf-icon-button" type="button" data-wf-picker-open aria-label="Open date picker"><span data-wf-icon="calendar"></span></button>
    </div>
  </div>
  <div class="wf-field">
    <label class="wf-label" for="due-time">Time</label>
    <div class="wf-date-time-field">
      <input class="wf-input" id="due-time" name="due-time" type="time" value="14:30" data-wf-picker-input>
      <button class="wf-button wf-button--ghost wf-icon-button" type="button" data-wf-picker-open aria-label="Open time picker"><span data-wf-icon="clock"></span></button>
    </div>
  </div>
  <div class="wf-field">
    <label class="wf-label" for="scheduled-at">Date and time</label>
    <div class="wf-date-time-field">
      <input class="wf-input" id="scheduled-at" name="scheduled-at" type="datetime-local" value="2026-09-18T14:30" data-wf-picker-input>
      <button class="wf-button wf-button--ghost wf-icon-button" type="button" data-wf-picker-open aria-label="Open date and time picker"><span data-wf-icon="calendar"></span></button>
    </div>
  </div>
</div>
