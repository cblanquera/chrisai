<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Category Manager Interface Sample</title><link rel="stylesheet" href="../../base/tokens.css"><link rel="stylesheet" href="../../base/reset.css"><link rel="stylesheet" href="../../base/base.css"><link rel="stylesheet" href="../../icons/icons.css"><link rel="stylesheet" href="../../components/buttons.css"><link rel="stylesheet" href="../../components/forms.css"><link rel="stylesheet" href="../../components/dialog.css"><link rel="stylesheet" href="../../components/notifier.css"><link rel="stylesheet" href="../../components/tree.css"><link rel="stylesheet" href="../../interfaces/category-manager.css?v=3"><link rel="stylesheet" href="../sample.css"></head><body class="sample-interface-page"><div class="sample-interface-shell"><nav class="sample-interface-nav"><a class="sample-link" href="../index.html"><span data-wf-icon="arrow-left"></span>All samples</a><p>Sortable hierarchical taxonomy</p></nav>
<section class="wf-category-manager" data-wf-category-manager aria-labelledby="category-manager-title"><header class="wf-category-manager__header"><div><h1 class="wf-heading" id="category-manager-title">Product categories</h1><p class="wf-copy">Arrange the catalog hierarchy.</p></div><div class="wf-row wf-row-wrap"><button class="wf-button wf-button--secondary" type="button" data-wf-category-action="rename" disabled><span data-wf-icon="edit"></span>Rename</button><button class="wf-button wf-button--secondary" type="button" data-wf-category-action="delete" disabled><span data-wf-icon="trash"></span>Delete</button><button class="wf-button wf-button--secondary" type="button" data-wf-category-action="add-child" disabled><span data-wf-icon="add"></span>Add child</button><button class="wf-button" type="button" data-wf-category-action="add-root"><span data-wf-icon="add"></span>Add category</button></div></header><div class="wf-category-manager__search"><label class="wf-field"><span class="wf-sr-only">Search categories</span><input class="wf-input" type="search" placeholder="Search categories" data-wf-category-search></label><span class="wf-category-manager__count" data-wf-category-count></span></div><ul class="wf-tree wf-category-manager__tree" data-wf-tree data-wf-tree-select="single" data-wf-category-tree aria-label="Sortable category hierarchy"></ul><dialog class="wf-dialog" data-wf-category-dialog><form data-wf-category-form><header class="wf-dialog__header"><h2 class="wf-subheading" data-wf-category-dialog-title>Add category</h2></header><div class="wf-dialog__body"><label class="wf-field"><span class="wf-label">Category name *</span><input class="wf-input" name="name" required></label></div><footer class="wf-dialog__footer"><button class="wf-button wf-button--secondary" type="button" data-wf-dialog-close>Cancel</button><button class="wf-button" type="submit">Save</button></footer></form></dialog><dialog class="wf-dialog" data-wf-category-delete-dialog><header class="wf-dialog__header"><h2 class="wf-subheading">Delete category?</h2></header><div class="wf-dialog__body"><p>Its nested categories will also be removed.</p></div><footer class="wf-dialog__footer"><button class="wf-button wf-button--secondary" type="button" data-wf-dialog-close>Cancel</button><button class="wf-button" type="button" data-wf-category-confirm-delete>Delete</button></footer></dialog><script type="application/json" data-wf-category-data>{"categories":[{"id":"apparel","parentId":null,"name":"Apparel"},{"id":"women","parentId":"apparel","name":"Women"},{"id":"dresses","parentId":"women","name":"Dresses"},{"id":"tops","parentId":"women","name":"Tops"},{"id":"men","parentId":"apparel","name":"Men"},{"id":"shirts","parentId":"men","name":"Shirts"},{"id":"home","parentId":null,"name":"Home and living"},{"id":"decor","parentId":"home","name":"Decor"},{"id":"kitchen","parentId":"home","name":"Kitchen"},{"id":"seasonal","parentId":null,"name":"Seasonal"}],"expanded":["apparel","women","men","home"]}</script></section></div><div class="wf-notifier" data-wf-notifier aria-live="polite"></div><script src="../../icons/icons.js"></script><script src="../../components/dialog.js"></script><script src="../../components/notifier.js"></script><script src="../../components/tree.js"></script><script src="../../interfaces/category-manager.js?v=2"></script><script src="../../utilities/interactions.js"></script></body></html>
