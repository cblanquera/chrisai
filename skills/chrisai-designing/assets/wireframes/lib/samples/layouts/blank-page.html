<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Blank Page Layout Sample</title>
  <link rel="stylesheet" href="../../base/tokens.css">
  <link rel="stylesheet" href="../../base/reset.css">
  <link rel="stylesheet" href="../../base/base.css">
  <link rel="stylesheet" href="../../icons/icons.css">
  <link rel="stylesheet" href="../../components/buttons.css">
  <link rel="stylesheet" href="../../layouts/blank-page.css">
  <link rel="stylesheet" href="../sample.css">

<body>
  <main class="wf-blank">
    <section class="wf-blank__panel wf-surface">
      <p class="wf-kicker">Blank page</p>
      <h1 class="wf-title">Set up your workspace</h1>
      <p class="wf-copy">Use this layout for welcome, empty, setup, or focused decision screens.</p>
      <div class="wf-blank__actions">
        <a class="wf-button" href="../index.html">Primary action <span data-wf-icon="arrow-right"></span></a>
        <button class="wf-button wf-button--secondary" type="button">Secondary</button>
      </div>
    </section>
  </main>
  <script src="../../icons/icons.js"></script>
