<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Date and Time Field Sample</title>
  <link rel="stylesheet" href="../../base/tokens.css"><link rel="stylesheet" href="../../base/reset.css"><link rel="stylesheet" href="../../base/base.css"><link rel="stylesheet" href="../../icons/icons.css">
  <link rel="stylesheet" href="../../components/buttons.css"><link rel="stylesheet" href="../../components/forms.css"><link rel="stylesheet" href="../../components/date-time-field.css"><link rel="stylesheet" href="../sample.css">
</head>
<body>
  <main class="sample-page"><div class="sample-shell wf-stack"><a class="sample-link" href="../index.html">Back to samples</a><h1 class="wf-title">Date and time inputs</h1>
    <section class="sample-frame wf-form">
      <div class="wf-field"><label class="wf-label" for="sample-date">Date</label><div class="wf-date-time-field"><input class="wf-input" id="sample-date" type="date" value="2026-09-18" data-wf-picker-input><button class="wf-button wf-button--ghost wf-icon-button" type="button" data-wf-picker-open aria-label="Open date picker"><span data-wf-icon="calendar"></span></button></div></div>
      <div class="wf-field"><label class="wf-label" for="sample-time">Time</label><div class="wf-date-time-field"><input class="wf-input" id="sample-time" type="time" value="14:30" data-wf-picker-input><button class="wf-button wf-button--ghost wf-icon-button" type="button" data-wf-picker-open aria-label="Open time picker"><span data-wf-icon="clock"></span></button></div></div>
      <div class="wf-field"><label class="wf-label" for="sample-datetime">Date and time</label><div class="wf-date-time-field"><input class="wf-input" id="sample-datetime" type="datetime-local" value="2026-09-18T14:30" data-wf-picker-input><button class="wf-button wf-button--ghost wf-icon-button" type="button" data-wf-picker-open aria-label="Open date and time picker"><span data-wf-icon="calendar"></span></button></div></div>
    </section>
  </div></main>
  <script src="../../icons/icons.js"></script><script src="../../components/date-time-field.js"></script><script src="../../utilities/interactions.js"></script>
</body>
</html>
