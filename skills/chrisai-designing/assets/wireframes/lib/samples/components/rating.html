<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Rating Sample</title>
  <link rel="stylesheet" href="../../base/tokens.css">
  <link rel="stylesheet" href="../../base/reset.css">
  <link rel="stylesheet" href="../../base/base.css">
  <link rel="stylesheet" href="../../icons/icons.css">
  <link rel="stylesheet" href="../../components/forms.css">
  <link rel="stylesheet" href="../../components/rating.css">
  <link rel="stylesheet" href="../sample.css">
</head>
<body>
  <main class="sample-page"><div class="sample-shell wf-stack">
    <a class="sample-link" href="../index.html">Back to samples</a>
    <h1 class="wf-title">Five star rating</h1>
    <section class="sample-frame">
      <div class="wf-field"><span class="wf-label" id="sample-rating-label">Service rating</span><div class="wf-rating" data-wf-rating role="radiogroup" aria-labelledby="sample-rating-label"><input type="hidden" value="4"><button type="button" role="radio" aria-checked="false" data-wf-rating-value="1" data-wf-rating-filled aria-label="1 star"><span data-wf-icon="star"></span></button><button type="button" role="radio" aria-checked="false" data-wf-rating-value="2" data-wf-rating-filled aria-label="2 stars"><span data-wf-icon="star"></span></button><button type="button" role="radio" aria-checked="false" data-wf-rating-value="3" data-wf-rating-filled aria-label="3 stars"><span data-wf-icon="star"></span></button><button type="button" role="radio" aria-checked="true" data-wf-rating-value="4" data-wf-rating-filled aria-label="4 stars"><span data-wf-icon="star"></span></button><button type="button" role="radio" aria-checked="false" data-wf-rating-value="5" aria-label="5 stars"><span data-wf-icon="star"></span></button><output data-wf-rating-output>4 of 5</output></div></div>
    </section>
  </div></main>
  <script src="../../icons/icons.js"></script>
  <script src="../../components/rating.js"></script>
  <script src="../../utilities/interactions.js"></script>
</body>
</html>
