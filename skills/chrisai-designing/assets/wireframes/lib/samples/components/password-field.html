<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Password Field Sample</title>
  <link rel="stylesheet" href="../../base/tokens.css">
  <link rel="stylesheet" href="../../base/reset.css">
  <link rel="stylesheet" href="../../base/base.css">
  <link rel="stylesheet" href="../../icons/icons.css">
  <link rel="stylesheet" href="../../components/buttons.css">
  <link rel="stylesheet" href="../../components/forms.css">
  <link rel="stylesheet" href="../../components/password-field.css">
  <link rel="stylesheet" href="../sample.css">
</head>
<body>
  <main class="sample-page"><div class="sample-shell wf-stack">
    <a class="sample-link" href="../index.html">Back to samples</a>
    <h1 class="wf-title">Password field</h1>
    <section class="sample-frame">
      <div class="wf-field" data-wf-password-field><label class="wf-label" for="sample-password">Password</label><div class="wf-password-field"><input class="wf-input wf-password-field__input" id="sample-password" type="password" value="prototype-password"><button class="wf-button wf-button--ghost wf-icon-button wf-password-field__toggle" type="button" data-wf-password-toggle aria-label="Show password" aria-pressed="false"><span data-wf-icon="eye"></span></button></div><p class="wf-help">Use at least 12 characters.</p></div>
    </section>
  </div></main>
  <script src="../../icons/icons.js"></script>
  <script src="../../components/password-field.js"></script>
  <script src="../../utilities/interactions.js"></script>
</body>
</html>
