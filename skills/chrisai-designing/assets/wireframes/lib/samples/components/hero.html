<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Hero Sample</title>
  <link rel="stylesheet" href="../../base/tokens.css">
  <link rel="stylesheet" href="../../base/reset.css">
  <link rel="stylesheet" href="../../base/base.css">
  <link rel="stylesheet" href="../../components/buttons.css">
  <link rel="stylesheet" href="../../components/hero.css">

<body>
  <main>
    <section class="wf-hero">
      <div class="wf-container wf-hero__inner">
        <div class="wf-hero__content">
          <a class="sample-link" href="../index.html">Back to samples</a>
          <p class="wf-kicker">Hero</p>
          <h1 class="wf-title">A focused starting point for an important product state</h1>
          <p class="wf-copy">Use the hero when the first viewport needs a clear offer, onboarding goal, or task entry.</p>
          <div class="wf-row wf-row-wrap">
            <button class="wf-button" type="button">Start flow</button>
            <button class="wf-button wf-button--secondary" type="button">View details</button>
          </div>
        </div>
        <div class="wf-hero__media" aria-label="Placeholder media"></div>
      </div>
