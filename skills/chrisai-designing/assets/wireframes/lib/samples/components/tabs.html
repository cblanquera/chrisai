<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Tabs Sample</title>
  <link rel="stylesheet" href="../../base/tokens.css">
  <link rel="stylesheet" href="../../base/reset.css">
  <link rel="stylesheet" href="../../base/base.css">
  <link rel="stylesheet" href="../../components/tabs.css">
  <link rel="stylesheet" href="../sample.css">
</head>
<body>
  <main class="sample-page">
    <div class="sample-shell wf-stack">
      <a class="sample-link" href="../index.html">Back to samples</a>
      <h1 class="wf-title">Tabs</h1>
      <section class="wf-tabs" data-wf-tabs>
        <div class="wf-tabs__list" role="tablist" aria-label="Record views">
          <button class="wf-tabs__tab" id="tab-summary" role="tab" type="button" aria-selected="true" aria-controls="panel-summary">Summary</button>
          <button class="wf-tabs__tab" id="tab-history" role="tab" type="button" aria-selected="false" aria-controls="panel-history" tabindex="-1">History</button>
          <button class="wf-tabs__tab" id="tab-files" role="tab" type="button" aria-selected="false" aria-controls="panel-files" tabindex="-1">Files</button>
        </div>
        <div class="wf-tabs__panel" id="panel-summary" role="tabpanel" aria-labelledby="tab-summary">Summary view content.</div>
        <div class="wf-tabs__panel" id="panel-history" role="tabpanel" aria-labelledby="tab-history" hidden>History view content.</div>
        <div class="wf-tabs__panel" id="panel-files" role="tabpanel" aria-labelledby="tab-files" hidden>Files view content.</div>
      </section>
    </div>
  </main>
  <script src="../../components/tabs.js"></script>
  <script src="../../utilities/interactions.js"></script>
</body>
</html>
