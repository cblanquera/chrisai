<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Switch Sample</title>
  <link rel="stylesheet" href="../../base/tokens.css">
  <link rel="stylesheet" href="../../base/reset.css">
  <link rel="stylesheet" href="../../base/base.css">
  <link rel="stylesheet" href="../../components/switch.css">
  <link rel="stylesheet" href="../sample.css">
</head>
<body>
  <main class="sample-page"><div class="sample-shell wf-stack">
    <a class="sample-link" href="../index.html">Back to samples</a>
    <h1 class="wf-title">Switch</h1>
    <section class="sample-frame wf-stack">
      <label class="wf-switch"><input class="wf-switch__input" type="checkbox" checked><span class="wf-switch__control" aria-hidden="true"></span><span class="wf-switch__copy"><strong>Push notifications</strong><span>Receive updates for assigned records.</span></span></label>
      <label class="wf-switch"><input class="wf-switch__input" type="checkbox"><span class="wf-switch__control" aria-hidden="true"></span><span class="wf-switch__copy"><strong>Weekly summary</strong><span>Send a digest every Monday.</span></span></label>
      <label class="wf-switch"><input class="wf-switch__input" type="checkbox" disabled><span class="wf-switch__control" aria-hidden="true"></span><span class="wf-switch__copy"><strong>Managed setting</strong><span>Controlled by the workspace administrator.</span></span></label>
    </section>
  </div></main>
</body>
</html>
