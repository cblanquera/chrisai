<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Cards Sample</title>
  <link rel="stylesheet" href="../../base/tokens.css">
  <link rel="stylesheet" href="../../base/reset.css">
  <link rel="stylesheet" href="../../base/base.css">
  <link rel="stylesheet" href="../../components/buttons.css">
  <link rel="stylesheet" href="../../components/cards.css">
  <link rel="stylesheet" href="../sample.css">
</head>
<body>
  <main class="sample-page">
    <div class="sample-shell wf-stack">
      <a class="sample-link" href="../index.html">Back to samples</a>
      <h1 class="wf-title">Cards</h1>
      <section class="sample-grid">
        <article class="wf-card">
          <div class="wf-card__header">
            <h2 class="wf-card__title">Basic card</h2>
          </div>
          <p class="wf-card__body">Use cards for repeated summaries, objects, or compact decision surfaces.</p>
        </article>
        <article class="wf-card wf-card--raised">
          <div class="wf-card__header">
            <h2 class="wf-card__title">Raised card</h2>
          </div>
          <p class="wf-card__body">Use raised cards sparingly when a selected or floating state matters.</p>
          <div class="wf-card__footer">
            <button class="wf-button wf-button--secondary" type="button">Open</button>
          </div>
        </article>
      </section>
    </div>
  </main>
</body>
</html>
