<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Date Range Picker Sample</title>
  <link rel="stylesheet" href="../../base/tokens.css"><link rel="stylesheet" href="../../base/reset.css"><link rel="stylesheet" href="../../base/base.css"><link rel="stylesheet" href="../../icons/icons.css">
  <link rel="stylesheet" href="../../components/buttons.css"><link rel="stylesheet" href="../../components/forms.css"><link rel="stylesheet" href="../../components/date-range-picker.css"><link rel="stylesheet" href="../sample.css">
</head>
<body>
  <main class="sample-page"><div class="sample-shell wf-stack"><a class="sample-link" href="../index.html">Back to samples</a><h1 class="wf-title">Date range picker</h1>
    <section class="sample-frame"><div class="wf-field" data-wf-date-range><span class="wf-label" id="sample-range-label">Reporting period</span><button class="wf-date-range__trigger" type="button" data-wf-date-range-trigger aria-expanded="false" aria-controls="sample-range-calendar" aria-labelledby="sample-range-label sample-range-value"><span id="sample-range-value" data-wf-date-range-output>Sep 8 - Sep 18, 2026</span><span data-wf-icon="calendar"></span></button>
      <div class="wf-date-range__popover" id="sample-range-calendar" data-wf-date-range-popover hidden><div class="wf-date-range__header"><button class="wf-button wf-button--ghost wf-icon-button" type="button" aria-label="Previous month"><span data-wf-icon="chevron-left"></span></button><strong>September 2026</strong><button class="wf-button wf-button--ghost wf-icon-button" type="button" aria-label="Next month"><span data-wf-icon="chevron-right"></span></button></div><div class="wf-date-range__weekdays" aria-hidden="true"><span>Su</span><span>Mo</span><span>Tu</span><span>We</span><span>Th</span><span>Fr</span><span>Sa</span></div><div class="wf-date-range__days" role="grid" aria-label="September 2026"><span></span><span></span><button type="button" data-wf-date-value="2026-09-01">1</button><button type="button" data-wf-date-value="2026-09-02">2</button><button type="button" data-wf-date-value="2026-09-03">3</button><button type="button" data-wf-date-value="2026-09-04">4</button><button type="button" data-wf-date-value="2026-09-05">5</button><button type="button" data-wf-date-value="2026-09-06">6</button><button type="button" data-wf-date-value="2026-09-07">7</button><button type="button" data-wf-date-value="2026-09-08">8</button><button type="button" data-wf-date-value="2026-09-09">9</button><button type="button" data-wf-date-value="2026-09-10">10</button><button type="button" data-wf-date-value="2026-09-11">11</button><button type="button" data-wf-date-value="2026-09-12">12</button><button type="button" data-wf-date-value="2026-09-13">13</button><button type="button" data-wf-date-value="2026-09-14">14</button><button type="button" data-wf-date-value="2026-09-15">15</button><button type="button" data-wf-date-value="2026-09-16">16</button><button type="button" data-wf-date-value="2026-09-17">17</button><button type="button" data-wf-date-value="2026-09-18">18</button><button type="button" data-wf-date-value="2026-09-19">19</button><button type="button" data-wf-date-value="2026-09-20">20</button><button type="button" data-wf-date-value="2026-09-21">21</button></div><div class="wf-date-range__footer"><span data-wf-date-range-status>Select a start date</span><button class="wf-button wf-button--ghost" type="button" data-wf-date-range-clear>Clear</button></div></div>
      <input type="hidden" value="2026-09-08" data-wf-date-range-start><input type="hidden" value="2026-09-18" data-wf-date-range-end>
    </div></section>
  </div></main>
  <script src="../../icons/icons.js"></script><script src="../../components/date-range-picker.js"></script><script src="../../utilities/interactions.js"></script>
</body>
</html>
