<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Alert Sample</title>
  <link rel="stylesheet" href="../../base/tokens.css">
  <link rel="stylesheet" href="../../base/reset.css">
  <link rel="stylesheet" href="../../base/base.css">
  <link rel="stylesheet" href="../../components/alert.css">
  <link rel="stylesheet" href="../sample.css">
</head>
<body>
  <main class="sample-page">
    <div class="sample-shell wf-stack">
      <a class="sample-link" href="../index.html">Back to samples</a>
      <h1 class="wf-title">Alerts</h1>
      <section class="wf-alert">
        <div>
          <p class="wf-alert__title">Default alert</p>
          <p class="wf-alert__body">A neutral status message for static and dynamic states.</p>
        </div>
      </section>
      <section class="wf-alert wf-alert--strong">
        <div>
          <p class="wf-alert__title">Strong alert</p>
          <p class="wf-alert__body">Use stronger tone for errors, blockers, or destructive outcomes.</p>
        </div>
      </section>
    </div>
  </main>
</body>
</html>
