<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Buttons Sample</title>
  <link rel="stylesheet" href="../../base/tokens.css">
  <link rel="stylesheet" href="../../base/reset.css">
  <link rel="stylesheet" href="../../base/base.css">
  <link rel="stylesheet" href="../../components/buttons.css">
  <link rel="stylesheet" href="../sample.css">
</head>
<body>
  <main class="sample-page">
    <div class="sample-shell wf-stack">
      <a class="sample-link" href="../index.html">Back to samples</a>
      <h1 class="wf-title">Buttons and button groups</h1>
      <section class="sample-frame wf-stack">
        <div class="wf-row wf-row-wrap">
          <button class="wf-button" type="button">Primary</button>
          <button class="wf-button wf-button--secondary" type="button">Secondary</button>
          <button class="wf-button wf-button--ghost" type="button">Ghost</button>
          <button class="wf-button" type="button" disabled>Disabled</button>
        </div>
        <div class="wf-button-group" role="group" aria-label="View mode">
          <button class="wf-button wf-button--secondary" type="button">Day</button>
          <button class="wf-button" type="button">Week</button>
          <button class="wf-button wf-button--secondary" type="button">Month</button>
        </div>
      </section>
    </div>
  </main>
</body>
</html>
