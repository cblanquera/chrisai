<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Table Sample</title>
  <link rel="stylesheet" href="../../base/tokens.css">
  <link rel="stylesheet" href="../../base/reset.css">
  <link rel="stylesheet" href="../../base/base.css">
  <link rel="stylesheet" href="../../components/badge.css">
  <link rel="stylesheet" href="../../components/table.css">
  <link rel="stylesheet" href="../sample.css">
</head>
<body>
  <main class="sample-page">
    <div class="sample-shell wf-stack">
      <a class="sample-link" href="../index.html">Back to samples</a>
      <h1 class="wf-title">Table</h1>
      <div class="wf-table-wrap">
        <table class="wf-table">
          <thead>
            <tr><th>Record</th><th>Owner</th><th>Status</th><th>Updated</th></tr>
          </thead>
          <tbody>
            <tr><td>Onboarding flow</td><td>Product</td><td><span class="wf-badge wf-badge--solid">Active</span></td><td>Today</td></tr>
            <tr><td>Billing review</td><td>Ops</td><td><span class="wf-badge">Draft</span></td><td>Yesterday</td></tr>
            <tr><td>Support export</td><td>Success</td><td><span class="wf-badge wf-badge--outline">Queued</span></td><td>Jul 9</td></tr>
          </tbody>
        </table>
      </div>
    </div>
  </main>
</body>
</html>
